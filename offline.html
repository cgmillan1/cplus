<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#110f0d">
<title>C Plus Admin</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; background: #110f0d; color: #fff;
         font: 17px/1.5 system-ui, -apple-system, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  main { max-width: 360px; }
  h1 { font-size: 22px; margin: 16px 0 8px; }
  p { opacity: .8; margin: 0 0 24px; }
  button { min-height: 48px; padding: 0 22px; border-radius: 14px; border: 0; font: 600 16px system-ui; background: #fff; color: #111; }
  img { width: 72px; height: 72px; border-radius: 18px; }
</style>
</head>
<body>
<main>
  <img src="icons/icon-192.png" alt="" onerror="this.remove()">
  <h1 data-en="You're offline" data-es="Estás sin conexión">You're offline</h1>
  <p data-en="Pages you opened before still work. Reconnect to see the latest." data-es="Las páginas que ya abriste siguen funcionando. Conéctate para ver lo más reciente.">Pages you opened before still work. Reconnect to see the latest.</p>
  <button onclick="location.reload()" data-en="Try again" data-es="Intentar de nuevo">Try again</button>
</main>
<script>
  if ((document.documentElement.lang || navigator.language).toLowerCase().startsWith('es'))
    document.querySelectorAll('[data-es]').forEach(e => e.textContent = e.dataset.es);
  addEventListener('online', () => location.reload());
</script>
</body>
</html>
